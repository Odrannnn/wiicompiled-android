plugins { id 'com.android.application' }

def withGame = project.hasProperty('withGame')
def withBuilder = project.hasProperty('withBuilder')

android {
    namespace 'org.wiicompiled.portlab'
    compileSdk 36
    ndkVersion '29.0.14206865'

    buildFeatures { buildConfig true }
    defaultConfig {
        // Kept for compatibility with private developer builds that still embed a runtime.
        buildConfigField 'boolean', 'WITH_GAME', withGame.toString()
        buildConfigField 'boolean', 'WITH_BUILDER', withBuilder.toString()
        applicationId 'org.wiicompiled.portlab'
        minSdk 30
        targetSdk 36
        versionCode 11
        versionName '0.3.0-alpha.9'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.5' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (withGame) {
        sourceSets.debug.java.srcDirs += ["src/game/java"]
        sourceSets.debug.manifest.srcFile "src/game/AndroidManifest.xml"
        sourceSets.debug.jniLibs.srcDirs += ["../../private/android-apk-libs"]
        packaging.jniLibs.useLegacyPackaging = true
    }
    if (withBuilder) {
        sourceSets.debug.jniLibs.srcDirs += ["../../.tools/android-builder/jniLibs"]
        sourceSets.debug.assets.srcDirs += ["../../.tools/android-builder/assets"]
        packaging.jniLibs.useLegacyPackaging = true
    }
    sourceSets.main.java.srcDirs += ["src/sdl/java"]
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

